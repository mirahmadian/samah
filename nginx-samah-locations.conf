# ──────────────────────────────────────────────────────────────
# Samah location blocks — for servers that ALREADY have another
# site as the default_server on port 80.
#
# Instead of adding a second (conflicting) `server` block, include
# this file INSIDE the existing server { } block of the other site:
#
#     server {
#         listen 80 default_server;
#         server_name _;
#         ...existing locations...
#         include /home/ubuntu/samah/nginx-samah-locations.conf;
#     }
#
# Then `sudo nginx -t && sudo systemctl reload nginx`.
#
# These three prefixes (/samah, /samahadmin, /samah-static) do not
# overlap with a typical app's /, /static/, /shop/, etc., so the
# existing site keeps working untouched.
# Adjust 8200 if you used a different SAMAH_PORT.
# ──────────────────────────────────────────────────────────────

location /samah {
    proxy_pass http://127.0.0.1:8200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
}

location /samahadmin {
    proxy_pass http://127.0.0.1:8200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
}

# App's own static assets (QR codes etc.) served by gunicorn under a
# unique prefix so it never clashes with the other site's /static.
location /samah-static {
    proxy_pass http://127.0.0.1:8200;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
