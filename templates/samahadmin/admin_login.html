<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود - پنل مدیریت سماح</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Vazirmatn',Tahoma,sans-serif; background: linear-gradient(135deg,#0d4a25,#1a6b3c); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { border:none; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.3); max-width:400px; width:100%; }
    .login-header { background:linear-gradient(135deg,#0d4a25,#1a6b3c); color:#fff; border-radius:16px 16px 0 0; padding:32px; text-align:center; }
    .form-control:focus { border-color:#1a6b3c; box-shadow:0 0 0 .2rem rgba(26,107,60,.25); }
    .btn-admin { background:#1a6b3c; border-color:#1a6b3c; color:#fff; }
    .btn-admin:hover { background:#0d4a25; border-color:#0d4a25; color:#fff; }
  </style>
</head>
<body>
<div class="login-card card">
  <div class="login-header">
    <div style="font-size:3rem">🔐</div>
    <h4 class="mt-2 mb-0">پنل مدیریت سماح</h4>
    <p class="opacity-75 small mb-0">سازمان حج و زیارت</p>
  </div>
  <div class="card-body p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">نام کاربری</label>
        <input type="text" name="username" class="form-control" required autofocus dir="ltr">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">رمز عبور</label>
        <input type="password" name="password" class="form-control" required dir="ltr">
      </div>
      <button type="submit" class="btn btn-admin w-100 fw-bold">
        <i class="bi bi-box-arrow-in-right me-2"></i>ورود به پنل
      </button>
    </form>
    <div class="text-center mt-3 text-muted small">
      نام کاربری پیش‌فرض: <code>admin</code> | رمز: <code>Admin@1234</code>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
